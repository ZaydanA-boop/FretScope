[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fretscope"
version = "0.1.0"
description = "Guitar Tone & Tab Analyzer: isolate the guitar in a song, transcribe it to tab/chords, and estimate the tone chain that produced it."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "yt-dlp>=2024.10.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
separation = [
    "demucs>=4.0.1",
    "torch>=2.2",
    "torchaudio>=2.2",
]
lyrics = [
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pedalboard>=0.9",   # only needed to regenerate the tone model dataset
]

[project.scripts]
fretscope = "fretscope.cli:main"

[tool.setuptools.packages.find]
include = ["fretscope*"]

[tool.setuptools.package-data]
"fretscope.web" = ["*.html", "*.css", "*.js", "*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
